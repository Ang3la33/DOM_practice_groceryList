<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Shopping List</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
    <h1>Add Grocery Item</h1>

    <form id="form1">

        <div class="input-group">
            <label for="dairy">Dairy Products</label>
            <input type="text" id="dairy" />
            <button type="button" class="add-icon-btn" onclick="addItem('dairy')">🛒 Add Item</button>
        </div>

        <div class="input-group">
            <label for="meat">Meat & Poultry</label>
            <input type="text" id="meat" />
            <button type="button" class="add-icon-btn" onclick="addItem('meat')">🛒 Add Item</button>
        </div>

        <div class="input-group">
            <label for="produce">Fruits & Vegetables</label>
            <input type="text" id="produce" />
            <button type="button" class="add-icon-btn" onclick="addItem('produce')">🛒 Add Item</button>
        </div>

        <div class="input-group">
            <label for="grains">Grains</label>
            <input type="text" id="grains" />
            <button type="button" class="add-icon-btn" onclick="addItem('grains')">🛒 Add Item</button>
        </div>

        <div class="input-group">
            <label for="other">Other</label>
            <input type="text" id="other" />
            <button type="button" class="add-icon-btn" onclick="addItem('other')">🛒 Add Item</button>
        </div>

    </form>

    <table id="data" class="u-full-width">
        <thead>
        <tr>
            <th>Dairy Products</th>
            <th>Meat & Poultry</th>
            <th>Fruits & Vegetables</th>
            <th>Grains</th>
            <th>Other</th>
            <th>X</th>
        </tr>
        </thead>
        <tbody id="grocery-list">
        <!-- Items inserted dynamically -->
        </tbody>
    </table>
</div>

<script src="script.js" defer></script>
</body>
</html>
